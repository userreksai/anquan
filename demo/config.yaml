# Linux 构建并单次执行：
# go run ./cmd/anqu-build -config ./demo/config.yaml -output ./demo/anqu -goos linux -goarch amd64
# ./demo/anqu -once
# Windows 演示可将目标改为 -goos windows，输出改为 ./demo/anqu.exe。
# 相对路径以生成的程序所在目录为基准；不启用 Linux 专用进程/journal 采集。
output_dir: output
state_file: state/md5.json
timezone: Asia/Shanghai

FilesMonitoring:
  dir:
    - watched

login:
  enabled: true
  source: jsonl
  path: login.jsonl
  timeout_seconds: 10
  max_records: 1000

server: []

setup:
  logs: output/logs/时间anquan.log
  prom: output/snapshots/时间process_monitor.prom
  interval_seconds: 300
