name: Go tests

on:
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/go-test.yml
  push:
    branches: [master]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/go-test.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Check collector, delivery and update races
        run: go test -race ./internal/security ./internal/downloadrelay ./internal/selfupdate ./internal/audit -count=1
      - name: Verify fresh command logging as root and an ordinary user
        run: |
          go test -race -c -o "$RUNNER_TEMP/anquan-history.test" ./internal/audit
          sudo "$RUNNER_TEMP/anquan-history.test" -test.run 'TestHistoryCommand|TestManagedHistory|TestEnsureHistoryScript|TestHistoryInstallation|TestHistoryEnforcement' -test.count=1 -test.v
