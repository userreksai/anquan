# Anqu v0.4.0：A 构建机保存 YAML，B/C 节点只运行内置加密配置的 agent。
# 复制为源码根目录 config.yaml，按目标节点实际情况调整后构建：
# go run ./cmd/anqu-build -output ./dist/anqu-linux-amd64 -goos linux -goarch amd64
# 配置区分大小写；fils 保留用户约定拼写；使用空格缩进。
# 配置中的路径属于目标节点。相对路径以节点程序所在目录为基准。

output_dir: /usr/local/anqu
state_file: state/md5.json   # 相对于 output_dir；新模块使用 .files/.processes/.logins 后缀
timezone: Asia/Shanghai      # 报告显示时区；日常日志切割始终使用北京时间

FilesMonitoring:
  fils:
    # 不提供 MD5：第一次获取全部文件 MD5，之后与上次成功扫描比较。
    - /etc/ssh/sshd_config|/etc/ssh/ssh_config
    - /etc/ssh/sshrc
    - /etc/hosts.allow
    # 如目标系统没有上述文件，会产生 missing 日志和告警，请按需求保留或移除。
    # 固定允许值示例：用目标文件的实际 md5sum 替换下面三个演示值后启用。
    # 两个文件分别匹配任意一个允许值即可，MD5 数量不必与路径数量相同。
    # - /opt/app/a.conf|/opt/app/b.conf,d41d8cd98f00b204e9800998ecf8427e,900150983cd24fb0d6963f7d28e17f72,5d41402abc4b2a76b9719d911017c592
  dir:
    - /etc/cron.d/           # 递归计算目录内普通文件，记录新增、修改、删除
  search:
    - authorized_keys,/root|/home/|/var/
    - id_rsa,/root|/home/|/var/
    # 搜索指定文件名并校验允许值的格式（以下 MD5 仍需替换）：
    # - authorized_keys,/root|/home|/var,d41d8cd98f00b204e9800998ecf8427e,900150983cd24fb0d6963f7d28e17f72

ProcessMonitoring:
  exists:
    # 整条规则是一个 YAML 字符串；任意一个完整命令行存在即正常。
    - '/usr/sbin/sshd -D|/usr/sbin/ssh -D'
  Process:
    # 首次建立进程列表，之后按完整命令和实例数量比较增删。
    # 白名单只免除列表变化告警，不免除上面的 exists 检查。
    whitelist:
      - /usr/sbin/sshd -D
  # 无白名单时写 Process: {}；只检查存在时删除整个 Process 段。

login:
  enabled: true
  source: journal            # journal（推荐）、authlog、jsonl、wtmp
  journal_command: journalctl
  initial_lookback_hours: 24 # journal/authlog/wtmp 初次回看时长
  timeout_seconds: 10
  max_records: 1000          # 每轮处理页上限，后续轮次继续读取，不只取最后一次登录
  # authlog: source 改为 authlog，path 改为 /var/log/auth.log 或 /var/log/secure
  # jsonl: source 改为 jsonl，path 填每行一条成功登录记录的 JSONL 文件
  # wtmp: source 改为 wtmp，path 填 /var/log/wtmp，last_command 填 last
  # path: /var/log/auth.log
  # last_command: last

# 默认只生成本地通知/日志/指标；主控 UDP 默认监听 55555。
server: []
# 有接收端后，将上面一行替换为：
# server:
#   - 172.22.0.100:55555
# 上报机器 IP 默认使用连接主控时的本地出口地址。
# NAT、多网卡或多主控场景可固定机器主键，各节点须保持唯一：
# agent_ip: 172.22.0.101

setup:
  logs: /var/log/时间anquan.log
  prom: /var/lib/node_exporter/textfile_collector/时间process_monitor.prom
  interval_seconds: 300     # -service 模式：首次立即执行，之后每 300 秒检查，不重叠执行
# logs 的“时间”或 {date} 替换为北京时间 YYYYMMDD，零点换新文件。
# prom 的“时间”或 {time} 替换为包含纳秒的采集时间，每轮独立文件。
# 不写占位符时自动添加日期/时间前缀。占位符只允许出现在文件名。
# 新模式不需 md5/existence 旧字段；旧配置格式仍可使用。
