# v0.7.0 组件接入示例。核对原配置和节点环境后，再在“组件与主机策略”页面合并使用。
# 机器先按原方式运行 Agent，再通过原下发功能选择机器应用本配置。
# TCP 配置地址/端口仍由原 agent.service 决定；此处仅设置原 UDP 上报目标。
# 已有完整配置时优先只合并 security 段，保留原 history、巡检和上报配置。
# 本例开启操作命令采集，当前标准 Linux 安装以 Agent 标准统一命令脚本，支持自定义日志path；
# 已有自定义/旧脚本不一致时先备份再原子替换；日志root:root 0644，保留内容和游标。
# 旧版 Agent 或自定义部署目录仍需外部记录机制，不需要采集时将 history.enabled 设为 false。
# 仅采集接入钩子的交互Bash；接管其他DEBUG trap，可修改的PROMPT_COMMAND属性会规范化。
# 只读等限制会明确报错；旧会话需退出重登，未生成或丢失的命令不能补回。
# 已知200>旧脚本先修复再转换，仅默认日志源可生成恢复凭证；不自动重置自定义源或未知截断。
output_dir: /usr/local/anquan
state_file: state/md5.json
timezone: Asia/Shanghai

# “安全事件 → 操作命令”来自此模块，和 Tetragon/auditd 的安全运行事件独立。
# history 位于完整 YAML 顶层，不填写到“Tetragon 配置”输入框。
# path、timezone 沿用原 history 配置；不要删除已有 .commands 游标。
# output_dir、state_file 也沿用原值，避免改变命令状态文件位置。
# 受管服务按history.timezone写入并解释；外部脚本须使用相同时区，不受顶层timezone影响。
# 首次启用会从头分批补传已有日志，正常命令只入库、不发送告警。
history:
  enabled: true
  path: /var/log/history.log
  timezone: Local
  poll_interval_ms: 1000
  max_records: 100

login:
  enabled: true
  mode: trigger
  source: journal
  journal_command: journalctl
  initial_lookback_hours: 24
  timeout_seconds: 10
  max_records: 1000

# 示例使用同主控部署地址。已有不同UDP上报地址时保留实际server列表，勿覆盖。
server: [172.22.0.27:55555]
setup:
  logs: /var/log/时间anquan.log
  prom: /var/lib/node_exporter/textfile_collector/process_monitor.prom
  interval_seconds: 300

security:
  enabled: true
  install_missing: true
  poll_interval_seconds: 2
  status_interval_seconds: 30
  max_queue_events: 10000

  # 自动使用系统包管理器安装 auditd，生成专用规则，不清空其他产品规则。
  # audit_exec 默认审计具有登录身份 auid 的外部程序执行，不覆盖所有Shell内建操作。
  auditd:
    enabled: true
    audit_exec: true
    watch_paths:
      - /etc/passwd
      - /etc/group
      - /etc/shadow
      - /etc/ssh
      - /etc/sudoers
      - /etc/sudoers.d
      - /etc/crontab
      - /etc/cron.d
    rules: []

  # 原生SHA256/权限/属主/链接监控，基线跨重启保留；Linux有inotify实时通知。
  native_fim:
    enabled: true
    paths:
      - /etc/passwd
      - /etc/group
      - /etc/shadow
      - /etc/ssh
      - /etc/sudoers
      - /etc/sudoers.d
      - /etc/crontab
      - /etc/cron.d
    poll_interval_seconds: 30
    capture_created_content: true  # 基线后新建文本及其后续版本，删除后仍可追溯；可显式关闭
    report_changes: false
    max_diff_bytes: 8192           # 每侧文本留存上限；超限保留前缀并标记，不是完整文件备份

  # 与原有成功登录通知独立：失败事件入库，5分钟同IP达5次产生告警。
  ssh_auth:
    enabled: true
    poll_interval_seconds: 5
    initial_lookback_seconds: 300
    alert_threshold: 5
    window_seconds: 300

  sudo:
    enabled: true
    io_logging: true
    upload_io: false             # 需要平台下载录制文件时开启
    max_session_bytes: 20971520  # 每会话20MiB上传上限
    grants: []                  # 仅enforce应用；不撤销其他sudoers里的广泛授权
    # grants:
    #   - user: ubuntu
    #     run_as: root
    #     commands: [/usr/bin/systemctl status agent.service]
    #     nopasswd: false

  # 可选增强。启用时默认官方HTTPS下载并校验，支持amd64/arm64且要求内核BTF。
  # 安装已有版本不会自动升级；自定义download_url必须配置可信sha256。
  tetragon:
    enabled: false
    version: v1.7.1
    download_url: ""
    sha256: ""
    config: ""
    tracing_policy: ""

  # audit只检查主机策略；组件安装和日志采集配置仍正常初始化。
  # 切换enforce后，下列启用的具体策略才会修改系统配置。
  policies:
    mode: audit
    ssh:
      enabled: false
      password_authentication: "no"
      permit_root_login: prohibit-password
      allow_users: []
      allow_sources: []
    sysctl: {}
    session_timeout_seconds: 0
    disable_ctrl_alt_del: false
    grub:
      enabled: false
      password_hash: ""
